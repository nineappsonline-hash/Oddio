name: Format Phase 5 final changes - final commit
on:
  push:
    branches:
      - feature/master-plan-phase-0-1
    paths:
      - '.github/workflows/format-feature.yml'
permissions:
  contents: write
concurrency:
  group: format-feature-branch
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'nineappsonline-hash/Oddio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Phase 5 preference sync and quality files
        run: |
          npx prettier --write \
            apps/web/src/app/api/discovery/preferences/route.ts \
            apps/web/src/app/api/discovery/mix/route.ts \
            apps/web/src/lib/discovery-preferences.ts \
            apps/web/src/components/music/DiscoveryMixShelf.tsx \
            apps/web/src/components/player/FlowButton.tsx \
            apps/web/src/lib/data/discovery-quality.ts \
            apps/web/src/lib/data/discovery-quality.test.ts \
            scripts/browser-release.mjs
      - name: Commit formatter output in development branch only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "oddio-ci-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src scripts/browser-release.mjs
          git commit -m "style(phase5): format sync and quality release checks"
          git push origin HEAD:feature/master-plan-phase-0-1
