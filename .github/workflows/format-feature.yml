name: Format Oddio feature branch

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  format-feature-only:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    concurrency:
      group: oddio-format-feature
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier to the feature branch
        run: npm run format
      - name: Commit formatting only when necessary
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          git add -- docs scripts apps packages workers supabase 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply project Prettier formatting across feature branch"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
