name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify media worker credentials and Cloudflare signing safety
        run: node --test scripts/media-worker-safety.test.mjs
      - run: npm test
      - name: Verify free audio feature extraction and tempo abstention
        run: node --test scripts/music-features.test.mjs scripts/audio-fingerprint.test.mjs scripts/music-classifier.test.mjs scripts/heldout-evaluation.test.mjs scripts/model-release-cli.test.mjs
      - run: npm run test:release-env
      - name: Detect unresolved production persistence risks (advisory)
        run: |
          node --test scripts/audit-persistence.test.mjs
          node scripts/audit-persistence.mjs
      - run: npm run build
        env:
          DEMO_MODE: 'true'
          DEMO_AUTH_SECRET: ci-demo-secret
          NEXT_PUBLIC_SITE_URL: https://example.com
      - name: Install FFmpeg for audio integration checks
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -n 1
          else
            # Hosted mirrors may be throttled; allow FFmpeg time to download.
            timeout 600s sudo apt-get update -qq
            timeout 600s sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Check fingerprint similarity after actual MP3 re-encoding
        run: node --test scripts/audio-fingerprint-ffmpeg.test.mjs
      - name: Verify local consent-based audio dataset preparation
        run: node --test scripts/prepare-dataset-ffmpeg.test.mjs
      - name: Generate a four-second synthesized MP3 for real Range checks
        run: |
          mkdir -p apps/web/.data/seed-audio
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=4' -c:a libmp3lame -b:a 320k -ar 44100 apps/web/.data/seed-audio/track-1.mp3
      - name: Smoke-test free audio analyzer on synthetic MP3
        run: |
          node scripts/analyze-audio.mjs apps/web/.data/seed-audio/track-1.mp3 > /tmp/oddio-analysis.json
          node --input-type=module -e '
            import fs from "node:fs";
            const result = JSON.parse(fs.readFileSync("/tmp/oddio-analysis.json", "utf8"));
            if (result.schemaVersion !== 1 || !/^[a-f0-9]{64}$/.test(result.fileSha256))
              throw new Error("Analyzer did not report valid SHA-256");
            if (!(result.durationSeconds >= 3 && result.durationSeconds <= 5))
              throw new Error("Unexpected decoded signal duration");
            if (result.tempoBpm !== null)
              throw new Error("Very short audio must not invent a BPM");
          '
      - name: HTTP smoke test — bilingual routes, SEO and audio bytes
        env:
          DEMO_MODE: 'true'
          DEMO_AUTH_SECRET: ci-demo-secret
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
        run: |
          npm run start --workspace @ai-music/web -- -p 3100 > /tmp/oddio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/en > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/oddio-server.log
            exit 1
          fi
          SMOKE_AUDIO=true SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/smoke-release.mjs
      - run: npm run lint
      - run: npm run format:check

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aim_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema + run RLS tests
        run: npm run test:db

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Build preview-mode site
        run: npm run build
        env:
          DEMO_MODE: 'true'
          DEMO_AUTH_SECRET: ci-demo-secret
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      - name: Run English and Arabic browser flows on desktop and mobile
        env:
          DEMO_MODE: 'true'
          DEMO_AUTH_SECRET: ci-demo-secret
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
        run: |
          npm run start --workspace @ai-music/web -- -p 3100 > /tmp/oddio-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/en > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/oddio-browser-server.log
            exit 1
          fi
          for browser in chromium firefox webkit; do
            BROWSER_ENGINE="$browser" SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/browser-release.mjs
          done
          SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/mobile-performance.mjs
