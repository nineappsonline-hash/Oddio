name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DEMO_MODE: 'true'
          DEMO_AUTH_SECRET: ci-demo-secret
          NEXT_PUBLIC_SITE_URL: https://example.com
      - name: HTTP smoke test — bilingual routes and SEO
        env:
          DEMO_MODE: 'true'
          DEMO_AUTH_SECRET: ci-demo-secret
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
        run: |
          npm run start --workspace @ai-music/web -- -p 3100 > /tmp/oddio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/en > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/oddio-server.log
            exit 1
          fi
          SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/smoke-release.mjs
      - run: npm run lint
      - run: npm run format:check

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aim_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema + run RLS tests
        run: npm run test:db
