name: Format Oddio blue accents (one-time)
on:
  push:
    branches: [feature/oddio-2-foundation]
    paths: [.github/workflows/oddio-blue-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Format graphite blue theme with pinned Prettier
        run: |
          npx prettier --write \
            packages/ui/src/index.ts \
            apps/web/src/app/oddio-magicpath.css \
            apps/web/src/components/layout/magicpath-home-shell.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/ui/src/index.ts apps/web/src/app/oddio-magicpath.css apps/web/src/components/layout/magicpath-home-shell.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format graphite blue UI accents"
          git fetch origin feature/oddio-2-foundation
          git rebase origin/feature/oddio-2-foundation
          git push origin HEAD:feature/oddio-2-foundation
