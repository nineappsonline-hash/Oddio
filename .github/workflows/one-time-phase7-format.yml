name: Temporary Phase 7 Formatting
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  format-history:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/ux-phase7-podcast-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only phase 7 changed files
        run: |
          npx prettier --write \
            'apps/web/src/app/[locale]/podcasts/history/page.tsx' \
            'apps/web/src/app/[locale]/podcasts/page.tsx' \
            'apps/web/src/components/podcasts/PodcastListeningHistory.tsx' \
            'apps/web/src/lib/podcast-progress-store.ts' \
            'apps/web/src/lib/podcast-listening-history.test.ts'
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style: format podcast listening history phase"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
