name: Format phase 6 development changes
on:
  push:
    branches:
      - feature/master-plan-phase-0-1
    paths:
      - '.github/workflows/format-phase6.yml'
permissions:
  contents: write
jobs:
  format-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format phase 6 code
        run: |
          npx prettier --write \
            apps/web/src/lib/data/artist-insights.ts \
            apps/web/src/lib/data/artist-insights.test.ts \
            apps/web/src/app/'[locale]'/studio/insights/page.tsx \
            apps/web/src/app/'[locale]'/studio/page.tsx \
            apps/web/src/lib/upload-audio-progress.ts \
            apps/web/src/components/studio/UploadForm.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "oddio-ci-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          git commit -m "style(phase6): normalize artist studio and upload progress code"
          git push origin HEAD:feature/master-plan-phase-0-1
