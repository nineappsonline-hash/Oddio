name: Format petrol detail QA (one-time)
on:
  push:
    branches: [feature/oddio-2-foundation]
    paths: [.github/workflows/oddio-detail-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            apps/web/src/components/layout/AppShell.tsx \
            apps/web/src/app/oddio-magicpath.css \
            apps/web/src/components/layout/magicpath-home-shell.css \
            scripts/capture-home-previews.mjs \
            scripts/browser-release.mjs
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/components/layout/AppShell.tsx apps/web/src/app/oddio-magicpath.css apps/web/src/components/layout/magicpath-home-shell.css scripts/capture-home-previews.mjs scripts/browser-release.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format petrol palette and detail shell QA"
          git fetch origin feature/oddio-2-foundation
          git rebase origin/feature/oddio-2-foundation
          git push origin HEAD:feature/oddio-2-foundation
