name: Format Phase 8 audio transitions - audible accounting final
on:
  push:
    branches: [feature/master-plan-phase-0-1]
    paths: ['.github/workflows/format-audio-transitions.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            apps/web/src/lib/player-store.ts \
            apps/web/src/components/player/PlayerProvider.tsx \
            apps/web/src/components/player/FullPlayer.tsx \
            apps/web/src/lib/audio-transitions.ts \
            apps/web/src/lib/audio-transitions.test.ts \
            apps/web/src/app/api/studio/tracks/'[id]'/offline-rights/route.ts \
            apps/web/src/components/studio/OfflineRightsConsent.tsx \
            apps/web/src/app/'[locale]'/studio/tracks/page.tsx
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "oddio-ci-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          git commit -m "style(phase8): format audio transitions and player settings"
          git push origin HEAD:feature/master-plan-phase-0-1
