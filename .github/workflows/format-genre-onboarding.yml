name: Format first-run genre onboarding

on:
  push:
    branches: [feat/first-signup-genre-modal]
    paths:
      - .github/workflows/format-genre-onboarding.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/first-signup-genre-modal
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format onboarding changes and commit safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin feat/first-signup-genre-modal
            git reset --hard origin/feat/first-signup-genre-modal
            npx prettier --write               apps/web/src/components/onboarding/FavoriteGenresSelector.tsx               apps/web/src/components/music/DiscoveryMixShelf.tsx               apps/web/src/components/layout/AppShell.tsx               apps/web/src/app/'[locale]'/settings/page.tsx               apps/web/src/app/api/onboarding/favorite-genres/route.ts \
              scripts/browser-release.mjs
            if git diff --quiet; then exit 0; fi
            git add --update
            git commit -m 'style(onboarding): format welcome dialog and preference API'
            if git push origin HEAD:feat/first-signup-genre-modal; then exit 0; fi
          done
          exit 1
