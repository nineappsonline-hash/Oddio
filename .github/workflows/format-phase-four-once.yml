name: Format Phase 4 feature slice once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format-phase-four:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository-pinned Prettier
        run: |
          npx prettier --write \
            workers/media/src/music-features.mjs \
            workers/media/src/index.mjs \
            scripts/analyze-audio.mjs \
            scripts/music-features.test.mjs \
            packages/contracts/src/index.ts \
            'apps/web/src/app/[locale]/tracks/[id]/page.tsx' \
            apps/web/src/lib/data/supabase-store.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git add -- workers/media/src/music-features.mjs workers/media/src/index.mjs scripts/analyze-audio.mjs scripts/music-features.test.mjs packages/contracts/src/index.ts 'apps/web/src/app/[locale]/tracks/[id]/page.tsx' apps/web/src/lib/data/supabase-store.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Phase 4 audio feature extraction"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
