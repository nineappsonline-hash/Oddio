name: Format phase 3 changes once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format-phase-three:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply project Prettier to phase-three code
        run: npx prettier --write apps/web/src/app/'[locale]'/search/page.tsx apps/web/src/lib/data/queries.ts apps/web/src/lib/data/phase3-library-search.test.ts scripts/browser-release.mjs
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git add -- apps/web/src/app/'[locale]'/search/page.tsx apps/web/src/lib/data/queries.ts apps/web/src/lib/data/phase3-library-search.test.ts scripts/browser-release.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format phase-three search and library tests"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
