name: Phase 10 Final Formatting
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  final-format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/ux-phase10-podcast-notifications'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format remaining files
        run: |
          npx prettier --write \
            'apps/web/src/app/[locale]/podcasts/page.tsx' \
            'apps/web/src/app/api/podcasts/notifications/route.ts'
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style: finish podcast notification formatting"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
