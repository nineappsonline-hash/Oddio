name: Format mobile performance release once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-mobile-release-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier rules
        run: |
          npx prettier --write \
            'apps/web/src/components/player/SimilarPlayerPanel.tsx' \
            'apps/web/src/lib/lyrics-timing.ts' \
            'apps/web/src/lib/lyrics-timing.test.ts' \
            'apps/web/src/components/player/FullPlayer.tsx' \
            'apps/web/src/components/providers/ClientPerformance.tsx' \
            'apps/web/src/app/api/performance/route.ts' \
            'apps/web/src/components/layout/AppShell.tsx' \
            'apps/web/src/components/player/PlayerProvider.tsx' \
            'apps/web/src/app/[locale]/admin/analytics/performance/page.tsx' \
            'apps/web/src/app/[locale]/admin/analytics/page.tsx'
      - name: Commit formatting corrections
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format web and audio performance monitoring"
            git push origin HEAD:main
          fi
