name: Temporary release hardening formatting

on:
  pull_request:
    branches:
      - feature/oddio-release-qa-v6

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'jimmydodo/oddio' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/oddio-final-release-hardening-v7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oddio-final-release-hardening-v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only release hardening edits
        run: |
          npx prettier --write .github/workflows/format-hardening-v7.yml scripts/browser-release.mjs scripts/release-env-preflight.mjs scripts/release-env-preflight.test.mjs apps/web/src/lib/env.ts apps/web/src/lib/env.test.ts 'apps/web/src/app/[locale]/admin/reports/page.tsx' .github/workflows/ci.yml docs/oddio-release-gates.md package.json
          npm run format:check
      - name: Commit normalized files on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize release hardening files"
            git push origin HEAD:feature/oddio-final-release-hardening-v7
          fi
