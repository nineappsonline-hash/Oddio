name: Format Phase 4 independent validation once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only heldout evaluation and consent dataset files
        run: |
          npx prettier --write \
            workers/media/src/heldout-evaluation.mjs \
            workers/media/src/music-classifier.mjs \
            scripts/train-music-classifier.mjs \
            scripts/prepare-music-dataset.mjs \
            scripts/music-classifier.test.mjs \
            scripts/heldout-evaluation.test.mjs \
            scripts/model-release-cli.test.mjs \
            scripts/prepare-dataset-ffmpeg.test.mjs
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git add -- workers/media/src/heldout-evaluation.mjs workers/media/src/music-classifier.mjs scripts/train-music-classifier.mjs scripts/prepare-music-dataset.mjs scripts/music-classifier.test.mjs scripts/heldout-evaluation.test.mjs scripts/model-release-cli.test.mjs scripts/prepare-dataset-ffmpeg.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format private model evaluation and dataset tooling"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
