name: Format later phase development files - PWA final
on:
  push:
    branches:
      - feature/master-plan-phase-0-1
    paths:
      - '.github/workflows/format-later-phases.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            apps/web/src/app/manifest.ts \
            apps/web/src/app/'[locale]'/layout.tsx \
            apps/web/src/lib/data/monthly-recap.ts \
            apps/web/src/lib/data/monthly-recap.test.ts \
            apps/web/src/components/library/ShareRecap.tsx \
            apps/web/src/app/'[locale]'/library/recap/page.tsx \
            apps/web/src/app/'[locale]'/library/page.tsx \
            apps/web/public/sw.js \
            apps/web/src/components/providers/StaticServiceWorker.tsx
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "oddio-ci-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src apps/web/public/sw.js
          git commit -m "style(later-phases): format recap and installability files"
          git push origin HEAD:feature/master-plan-phase-0-1
