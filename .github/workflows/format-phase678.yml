name: Format Phase 6-8 development batch - final PWA and invites
on:
  push:
    branches: [feature/master-plan-phase-0-1]
    paths: ['.github/workflows/format-phase678.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            apps/web/src/lib/data/annual-listening-dna.ts \
            apps/web/src/lib/data/annual-listening-dna.test.ts \
            apps/web/src/app/'[locale]'/library/rewind/page.tsx \
            apps/web/src/app/'[locale]'/library/page.tsx \
            apps/web/src/components/player/PlayerProvider.tsx \
            apps/web/src/app/api/studio/appeals/route.ts \
            apps/web/src/app/api/admin/appeals/'[id]'/route.ts \
            apps/web/src/components/studio/TrackReviewAppeal.tsx \
            apps/web/src/app/'[locale]'/studio/tracks/page.tsx \
            apps/web/src/components/admin/ReviewAppealDecision.tsx \
            apps/web/src/app/'[locale]'/admin/appeals/page.tsx \
            apps/web/src/app/'[locale]'/admin/page.tsx \
            apps/web/src/app/'[locale]'/playlists/'[id]'/page.tsx \
            apps/web/src/components/playlists/PlaylistCollaboration.tsx \
            apps/web/src/app/api/playlists/collaboration/route.ts \
            apps/web/src/lib/data/atomic-social.ts \
            apps/web/src/components/studio/UploadForm.tsx \
            apps/web/src/lib/env.ts \
            apps/web/src/app/api/studio/uploads/finalize/route.ts \
            apps/web/src/app/api/studio/uploads/multipart/route.ts \
            apps/web/src/components/library/ShareRecap.tsx \
            apps/web/public/sw.js \
            workers/media/src/index.mjs \
            apps/web/src/app/api/playlists/route.ts \
            apps/web/src/components/pwa/InstallOddio.tsx \
            apps/web/src/app/'[locale]'/install/page.tsx \
            apps/web/src/components/layout/Sidebar.tsx
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "oddio-ci-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src apps/web/public/sw.js workers/media/src/index.mjs
          git commit -m "style(phase6-8): format appeals, rewind and lock-screen controls"
          git push origin HEAD:feature/master-plan-phase-0-1
