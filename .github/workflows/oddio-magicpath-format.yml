name: Oddio MagicPath formatting (temporary)
on:
  push:
    branches: [feature/oddio-2-foundation]
    paths:
      - .github/workflows/oddio-magicpath-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format MagicPath integration with repository's pinned Prettier
        run: npx prettier --write apps/web/src/app/[locale]/page.tsx apps/web/src/app/oddio-magicpath.css
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/app/[locale]/page.tsx apps/web/src/app/oddio-magicpath.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format MagicPath homepage integration"
          git fetch origin feature/oddio-2-foundation
          git rebase origin/feature/oddio-2-foundation
          git push origin HEAD:feature/oddio-2-foundation
