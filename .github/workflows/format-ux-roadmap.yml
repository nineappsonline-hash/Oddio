name: Format UX roadmap branch
# Phase 12 acceptance formatting pass: responsive Rewind and drag regression fixes.

on:
  push:
    branches:
      - feature/ux-roadmap-2026
    paths:
      - .github/workflows/format-ux-roadmap.yml

permissions:
  contents: write

concurrency:
  group: ux-roadmap-formatter
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ux-roadmap-2026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format latest feature head with bounded non-force retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Always start from the remote head, so formatter results cannot
            # conflict with newer feature work pushed during npm install.
            git fetch origin feature/ux-roadmap-2026
            git reset --hard origin/feature/ux-roadmap-2026
            git diff --name-only -z --diff-filter=ACM origin/main...HEAD |
              xargs -0 -r -n 1 sh -c '
                case "$0" in
                  *.ts|*.tsx|*.js|*.mjs|*.cjs|*.json|*.md|*.yml|*.yaml|*.css)
                    if test -f "$0"; then npx prettier --write "$0"; fi ;;
                esac
              '
            if git diff --quiet; then
              echo 'Already formatted'
              exit 0
            fi
            git add --update
            git commit -m 'style: apply Prettier to UX roadmap files'
            if git push origin HEAD:feature/ux-roadmap-2026; then
              exit 0
            fi
            echo "Remote advanced while formatting; retry $attempt" >&2
          done
          echo 'Formatting commit could not be safely pushed' >&2
          exit 1
