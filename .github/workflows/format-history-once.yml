name: Format Phase 3 history and search once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format-slice:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only Phase 3 files
        run: npx prettier --write apps/web/src/lib/music-search.ts apps/web/src/lib/music-search.test.ts apps/web/src/lib/data/listening-history.ts apps/web/src/lib/data/listening-history.test.ts apps/web/src/lib/data/supabase-store.ts
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          git add -- apps/web/src/lib/music-search.ts apps/web/src/lib/music-search.test.ts apps/web/src/lib/data/listening-history.ts apps/web/src/lib/data/listening-history.test.ts apps/web/src/lib/data/supabase-store.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Phase 3 history and search improvements"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
