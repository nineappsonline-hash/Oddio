name: Format Phase 3 privacy and resume once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format-feature:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier only to new Phase 3 files
        run: |
          npx prettier --write \
            'apps/web/src/app/api/library/history/route.ts' \
            'apps/web/src/components/library/ClearListeningHistory.tsx' \
            'apps/web/src/app/api/player/resume/route.ts' \
            'apps/web/src/components/player/PlayerProvider.tsx' \
            'apps/web/src/app/api/artists/[id]/aliases/route.ts' \
            'apps/web/src/components/studio/ArtistSearchAliases.tsx' \
            'apps/web/src/app/[locale]/studio/artists/[id]/page.tsx' \
            'apps/web/src/lib/data/supabase-store.ts' \
            'apps/web/src/lib/data/queries.ts' \
            'apps/web/src/lib/data/phase3-library-search.test.ts' \
            'packages/contracts/src/index.ts' \
            'scripts/browser-release.mjs'
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add -- apps/web/src/app/api/library/history/route.ts apps/web/src/components/library/ClearListeningHistory.tsx apps/web/src/app/api/player/resume/route.ts apps/web/src/components/player/PlayerProvider.tsx 'apps/web/src/app/api/artists/[id]/aliases/route.ts' apps/web/src/components/studio/ArtistSearchAliases.tsx 'apps/web/src/app/[locale]/studio/artists/[id]/page.tsx' apps/web/src/lib/data/supabase-store.ts apps/web/src/lib/data/queries.ts apps/web/src/lib/data/phase3-library-search.test.ts packages/contracts/src/index.ts scripts/browser-release.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Phase 3 privacy, player sync and artist aliases"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
