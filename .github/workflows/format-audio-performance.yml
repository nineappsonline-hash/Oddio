name: Format audio performance changes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-audio-performance.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format the scoped audio changes
        run: |
          npx prettier --write 'apps/web/src/components/player/PlayerProvider.tsx' 'apps/web/src/lib/data/supabase-store.ts' 'apps/web/src/app/api/stream/[id]/route.ts' 'apps/web/src/app/api/tracks/[id]/playback/route.ts'
      - name: Commit formatting adjustments
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format optimized streaming and player logic"
            git push origin HEAD:main
          fi
