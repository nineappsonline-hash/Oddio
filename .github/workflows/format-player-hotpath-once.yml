name: Format player hotpath fixes once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-player-hotpath-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format current player and browser files
        run: |
          git fetch origin main
          git reset --hard origin/main
          npx prettier --write \
            'apps/web/src/components/player/PlayerProvider.tsx' \
            'apps/web/src/components/player/PlayerProgress.tsx' \
            'apps/web/src/components/player/PlayerBar.tsx' \
            'apps/web/src/app/api/performance/route.ts' \
            'scripts/browser-release.mjs'
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format mobile player and regression fixes"
            git push origin HEAD:main
          fi
