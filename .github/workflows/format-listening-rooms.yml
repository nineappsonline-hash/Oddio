name: Format Listening Rooms development
on:
  push:
    branches: [feature/master-plan-phase-0-1]
    paths: ['.github/workflows/format-listening-rooms.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier for rooms
        run: |
          npx prettier --write \
            apps/web/src/app/api/rooms/route.ts \
            apps/web/src/app/'[locale]'/rooms/page.tsx \
            apps/web/src/app/'[locale]'/rooms/'[id]'/page.tsx \
            apps/web/src/components/rooms/RoomLobby.tsx \
            apps/web/src/components/rooms/RoomSession.tsx \
            apps/web/src/lib/room-playback-sync.ts \
            apps/web/src/lib/room-playback-sync.test.ts \
            apps/web/src/components/layout/MobileNav.tsx \
            apps/web/src/components/layout/Sidebar.tsx
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "oddio-ci-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          git commit -m "style(phase7): format moderated listening rooms"
          git push origin HEAD:feature/master-plan-phase-0-1
