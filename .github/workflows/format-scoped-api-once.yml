name: Format final scoped API changes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-scoped-api-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format current branch sources
        run: |
          git fetch origin main
          git reset --hard origin/main
          npx prettier --write \
            'apps/web/src/app/api/home/route.ts' \
            'apps/web/src/app/api/player/similar/route.ts' \
            'apps/web/public/sw.js'
      - name: Commit only formatting corrections
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format lightweight autoplay and suggestions routes"
            git push origin HEAD:main
          fi
