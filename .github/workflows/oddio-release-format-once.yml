name: One-time formatting for release gates
on:
  push:
    branches: [feature/oddio-final-release-gates]
    paths: [.github/workflows/oddio-release-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format new release gate and audit with pinned Prettier
        run: npx prettier --write scripts/social-preview-smoke.mjs scripts/story-clip-browser.mjs docs/ODDIO_2_GAP_AUDIT_2026-11-28.md .github/workflows/ci.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/social-preview-smoke.mjs scripts/story-clip-browser.mjs docs/ODDIO_2_GAP_AUDIT_2026-11-28.md .github/workflows/ci.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Oddio release gates"
          git fetch origin feature/oddio-final-release-gates
          git rebase origin/feature/oddio-final-release-gates
          git push origin HEAD:feature/oddio-final-release-gates
