name: Final Phase 6 upload fingerprint formatting
on:
  push:
    branches:
      - feature/master-plan-phase-0-1
    paths:
      - '.github/workflows/format-upload-fingerprint.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/lib/upload-audio-multipart.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "oddio-ci-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/upload-audio-multipart.ts
          git commit -m "style(phase6): format secure multipart resume fingerprint"
          git push origin HEAD:feature/master-plan-phase-0-1
