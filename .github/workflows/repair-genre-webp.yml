name: Diagnose and repair genre WebP artwork
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-genre-webp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Validate image payloads and repair non-WebP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, UnidentifiedImageError
          import io
          root = Path('apps/web/public/genres')
          failures = []
          repaired = []
          for path in sorted(root.glob('*.webp')):
              data = path.read_bytes()
              try:
                  with Image.open(io.BytesIO(data)) as im:
                      im.load()
                      fmt = im.format
                      dimensions = im.size
                      if fmt != 'WEBP':
                          fixed = im.convert('RGB')
                          fixed.save(path, 'WEBP', quality=90, method=6)
                          repaired.append(path.name)
                      print(f'{path.name}: detected={fmt}, dimensions={dimensions}, repaired={fmt != "WEBP"}')
              except Exception as exc:
                  failures.append((path.name, str(exc)))
          print(f'Validated {len(list(root.glob("*.webp")))} images; repaired {len(repaired)}')
          for name, reason in failures:
              print(f'INVALID {name}: {reason}')
          if failures:
              raise SystemExit('Some artwork cannot be decoded. Original files were preserved; upload valid replacements.')
          PY
      - name: Inspect representative image pixels
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, io
          for name in ['Acoustic.webp', 'Afrobeats.webp', 'Arabic Classical.webp', 'Blues.webp', 'Classical.webp', 'Ambient.webp']:
              image = Image.open(Path('apps/web/public/genres') / name).convert('RGB')
              image.thumbnail((160,160))
              buffer = io.BytesIO()
              image.save(buffer, format='JPEG', quality=55)
              print('THUMBNAIL ' + name + ' ' + base64.b64encode(buffer.getvalue()).decode())
          PY
      - name: Check production image URLs
        run: |
          python - <<'PY'
          import urllib.request
          from urllib.parse import quote
          names = ['Acoustic.webp', 'Afrobeats.webp', 'Arabic Classical.webp', 'Blues.webp', 'Classical.webp', 'Ambient.webp']
          for name in names:
              url = 'https://oddio.online/genres/' + quote(name)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'Oddio-asset-check'}), timeout=20) as response:
                      header = response.read(16)
                      print(f'{name}: HTTP {response.status}, content-type={response.headers.get("content-type")}, WEBP-header={header.startswith(bytes.fromhex("52494646")) and header[8:12] == b"WEBP"}')
              except Exception as error:
                  print(f'{name}: URL FAILED: {error}')
          PY
      - name: Commit repaired WebP files
        run: |
          if ! git diff --quiet -- apps/web/public/genres; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/public/genres
            git commit -m "fix: re-encode mislabeled genre artwork as real WebP"
            git push
          fi
