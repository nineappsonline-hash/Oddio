name: Oddio podcast smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * 1'

permissions:
  contents: read

jobs:
  public-podcast-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check podcast availability and access controls
        run: node scripts/podcast-smoke-test.mjs https://oddio.online
