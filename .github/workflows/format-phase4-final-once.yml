name: Format final Phase 4 validation once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format-final:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format final changed files
        run: |
          npx prettier --write \
            docs/oddio-master-implementation-plan.md \
            docs/music-intelligence-dataset.md \
            scripts/prepare-music-dataset.mjs \
            scripts/prepare-dataset-ffmpeg.test.mjs
      - name: Commit formatting and clean up
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/oddio-master-implementation-plan.md docs/music-intelligence-dataset.md scripts/prepare-music-dataset.mjs scripts/prepare-dataset-ffmpeg.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Phase 4 independent dataset documentation"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
