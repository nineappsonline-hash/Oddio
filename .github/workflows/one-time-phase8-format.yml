name: One-time Phase 8 Formatting
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  format-phase8:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/ux-phase8-follow-podcasts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply Prettier to Phase 8 files
        run: |
          npx prettier --write \
            'apps/web/src/app/[locale]/podcasts/following/page.tsx' \
            'apps/web/src/app/[locale]/podcasts/page.tsx' \
            'apps/web/src/app/[locale]/podcasts/shows/[slug]/page.tsx' \
            'apps/web/src/app/api/podcasts/follows/route.ts' \
            'apps/web/src/components/podcasts/PodcastFollowButton.tsx' \
            'scripts/test-db.sh' \
            'scripts/browser-release.mjs'
      - name: Commit formatting once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style: format podcast show follow feature"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
