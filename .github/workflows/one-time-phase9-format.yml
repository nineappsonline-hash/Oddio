name: One-time Phase 9 Formatting
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  format-phase9:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/ux-phase9-smart-podcast-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format phase nine files
        run: |
          npx prettier --write \
            'apps/web/src/lib/podcasts/recommendations.ts' \
            'apps/web/src/lib/podcasts/recommendations.test.ts' \
            'apps/web/src/app/[locale]/podcasts/for-you/page.tsx' \
            'apps/web/src/app/[locale]/podcasts/page.tsx' \
            'scripts/browser-release.mjs'
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style: format Phase 9 podcast discovery"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
