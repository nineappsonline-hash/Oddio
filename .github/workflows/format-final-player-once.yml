name: Format final player performance sources once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-final-player-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebase formatter on current main and apply Prettier
        run: |
          git fetch origin main
          git reset --hard origin/main
          npx prettier --write 'apps/web/src/components/player/PlayerQueueList.tsx' 'apps/web/src/components/player/FullPlayer.tsx' 'scripts/browser-release.mjs'
      - name: Commit formatted changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format separated queue and browser regression checks"
            git push origin HEAD:main
          fi
