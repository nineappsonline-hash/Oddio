name: Format browse shell QA (temporary)
on:
  push:
    branches: [feature/oddio-2-foundation]
    paths: [.github/workflows/oddio-browse-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format new browse shell and browser QA with pinned Prettier
        run: |
          npx prettier --write \
            apps/web/src/components/layout/MagicPathHomeChrome.tsx \
            scripts/browser-release.mjs \
            scripts/capture-home-previews.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/components/layout/MagicPathHomeChrome.tsx scripts/browser-release.mjs scripts/capture-home-previews.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format MagicPath browse shell and visual QA"
          git fetch origin feature/oddio-2-foundation
          git rebase origin/feature/oddio-2-foundation
          git push origin HEAD:feature/oddio-2-foundation
