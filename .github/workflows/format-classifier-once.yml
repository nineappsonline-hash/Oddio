name: Format Phase 4 classifier once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format-classifier:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format new classifier, fingerprint and Studio files
        run: |
          npx prettier --write \
            workers/media/src/audio-fingerprint.mjs \
            workers/media/src/music-classifier.mjs \
            workers/media/src/index.mjs \
            scripts/audio-fingerprint.test.mjs \
            scripts/audio-fingerprint-ffmpeg.test.mjs \
            scripts/music-classifier.test.mjs \
            scripts/train-music-classifier.mjs \
            'apps/web/src/app/api/studio/tracks/[id]/music-tags/route.ts' \
            'apps/web/src/app/[locale]/studio/tracks/page.tsx' \
            apps/web/src/components/studio/ReviewMusicTags.tsx \
            apps/web/src/lib/data/supabase-store.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git add -- workers/media/src/audio-fingerprint.mjs workers/media/src/music-classifier.mjs workers/media/src/index.mjs scripts/audio-fingerprint.test.mjs scripts/audio-fingerprint-ffmpeg.test.mjs scripts/music-classifier.test.mjs scripts/train-music-classifier.mjs 'apps/web/src/app/api/studio/tracks/[id]/music-tags/route.ts' 'apps/web/src/app/[locale]/studio/tracks/page.tsx' apps/web/src/components/studio/ReviewMusicTags.tsx apps/web/src/lib/data/supabase-store.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format reviewed genre classifier and fingerprinting"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
