name: One-time Phase 10 Formatting
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  format-phase10:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/ux-phase10-podcast-notifications'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Phase 10 files
        run: |
          npx prettier --write \
            'apps/web/src/lib/podcasts/notification-feed.ts' \
            'apps/web/src/lib/podcasts/notification-feed.test.ts' \
            'apps/web/src/lib/podcasts/notification-inbox.ts' \
            'apps/web/src/app/api/podcasts/notifications/route.ts' \
            'apps/web/src/components/podcasts/PodcastNotificationCenter.tsx' \
            'apps/web/src/app/[locale]/podcasts/notifications/page.tsx' \
            'apps/web/src/app/[locale]/podcasts/page.tsx' \
            'scripts/browser-release.mjs'
      - name: Commit once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "style: format Phase 10 podcast notifications"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
