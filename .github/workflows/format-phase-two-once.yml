name: Format phase 2 changes once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format-phase-two:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/master-plan-phase-0-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/master-plan-phase-0-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/src/components/player/FullPlayer.tsx scripts/browser-release.mjs apps/web/src/components/layout/Footer.tsx
      - name: Commit formatting of phase-2 files
        shell: bash
        run: |
          set -euo pipefail
          git add -- apps/web/src/components/player/FullPlayer.tsx scripts/browser-release.mjs apps/web/src/components/layout/Footer.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format player accessibility and browser smoke tests"
          git push origin HEAD:refs/heads/feature/master-plan-phase-0-1
