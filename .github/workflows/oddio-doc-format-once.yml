name: Format Oddio release document (one-time)
on:
  push:
    branches: [feature/oddio-2-foundation]
    paths: [.github/workflows/oddio-doc-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/ODDIO_2_DESIGN_AND_IMPLEMENTATION.md
      - name: Push formatting commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/ODDIO_2_DESIGN_AND_IMPLEMENTATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Oddio design plan"
          git fetch origin feature/oddio-2-foundation
          git rebase origin/feature/oddio-2-foundation
          git push origin HEAD:feature/oddio-2-foundation
