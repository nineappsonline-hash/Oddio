name: Format performance changes (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-performance-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier configuration
        run: npx prettier --write .
      - name: Commit formatting-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: normalize formatting for performance changes"
            git push origin HEAD:main
          fi
