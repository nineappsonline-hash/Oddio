name: Format Full Player optimization once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-fullplayer-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'apps/web/src/components/player/FullPlayer.tsx' 'apps/web/src/lib/storage/r2-stream-architecture.test.ts'
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: format lazy lyrics and R2 guard'
            git push origin HEAD:main
          fi
