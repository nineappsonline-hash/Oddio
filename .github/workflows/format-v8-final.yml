name: One-time v8 final format normalization

on:
  push:
    branches:
      - feature/oddio-release-blockers-fix-v8
    paths:
      - '.github/workflows/format-v8-final.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'jimmydodo/oddio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/oddio-release-blockers-fix-v8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run format:check
      - name: Commit style corrections on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize Safari and cron release fixes"
            git push origin HEAD:feature/oddio-release-blockers-fix-v8
          fi
